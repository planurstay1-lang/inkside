<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Touchscreen</title><style>.mcap{display:none!important}@media (max-width:560px){.stat .v{font-size:20px!important}.stats{align-items:flex-end}}@media (min-width:561px){.vset{top:4px!important}#stats{top:var(--vset-h,44px)!important}}</style><style>@media (max-width:560px){body > header{display:none}}</style><script>window.FIG_A = () => innerWidth <= 560 ? 1.1 : .75;</script><script>window.LBL_U = () => { if (innerWidth > 560) return 0; const s = document.getElementById("fig"); return s && s.clientWidth && s.viewBox.baseVal.width ? s.viewBox.baseVal.width / s.clientWidth : 0; };</script></head><body>
<script>
/* ============================================================
   Colorfigures core: projection, shapes, shading, ink, labels, page shell.
   A figure page includes this file (scripts/build.py inlines it), then calls mountFigure({...}).
   See SKILL.md for the drawing contract and conventions.
   One fixed view (front-left-top) and one fixed light (from above, behind the viewer's right shoulder: the front is lit,
   the left side is in shade, and cast shadows fall toward the lower left of the screen).
   ============================================================ */

/* ---------- palettes ---------- */
const PALS = {
  mustard: { l:'#f4b829', m:'#d49c1f', d:'#4e4a18' },
  tomato:  { l:'#ef6a4c', m:'#cf5038', d:'#4a2219' },
  mint:    { l:'#93d3b0', m:'#71b693', d:'#1f4034' },
  cobalt:  { l:'#76a0e2', m:'#5a82c6', d:'#1c2948' },
  blush:   { l:'#f3a6bb', m:'#d8869c', d:'#4b2430' },
};
const METAL   = { l:'#eef0f0', m:'#c6ccce', d:'#8f989b' };
const CLEAR   = { l:'#e4f2f4', m:'#c4dfe4', d:'#97b9c0' };
const CERAMIC = { l:'#fbfaf3', m:'#e3e0d2', d:'#bdb8a6' };
const DARK    = { l:'#55504a', m:'#3d3935', d:'#272421' };
const INK = '#231e16';
const SHADOW = '#41538f';

/* ---------- projection (x = depth toward viewer-right, y = toward viewer-left, z = up) ---------- */
const C = Math.cos(Math.PI/6), S = Math.sin(Math.PI/6);
let OX = 0, OY = 0;
/* Free orthographic camera (internal names start with CAM_ / cam so they never clash with a figure's own names). YAW turns the viewer around the vertical axis (45° = the classic front-left view),
   PITCH is how far it looks down (35.26° = true isometric). At the defaults P() is exactly the old isometric
   projection, so every figure drawn for it still lines up. Drag the figure to orbit; double-click to reset.
   rotV(n) maps a world direction into the default view's frame, so vis / tone / any "sum of rotV > 0" test keep
   working at every angle: the viewer is always (1,1,1) and the light stays put relative to the viewer. */
let VIEW = 0, RC = [0, 0], RCZ = 0;
const VIEW_NAMES = ['front', 'left side', 'back', 'right side'];
const TURNS = [0, 2];
const YAW0 = 45, PITCH0 = Math.atan(1/Math.SQRT2) * 180/Math.PI, CAM_K = Math.sqrt(1.5);
let YAW = YAW0, PITCH = PITCH0, CAM_R, CAM_U, CAM_V, CAM_D;                       // right, up, toward viewer, screen-down
const camBasis = (yaw, pitch) => { const t = yaw*Math.PI/180, p = pitch*Math.PI/180, ct = Math.cos(t), st = Math.sin(t), cp = Math.cos(p), sp2 = Math.sin(p);
  return { R:[st,-ct,0], U:[-sp2*ct,-sp2*st,cp], V:[cp*ct,cp*st,sp2] }; };
const CAM_B0 = camBasis(YAW0, PITCH0);
// CAM_LIM: how far (deg) the camera may turn either side of the front view; null = all the way round (set per figure)
let CAM_LIM = null;
function setCam(yaw, pitch){ YAW = CAM_LIM == null ? yaw : Math.max(YAW0 - CAM_LIM, Math.min(YAW0 + CAM_LIM, yaw));
  PITCH = CAM_LIM == null ? Math.max(6, Math.min(78, pitch)) : Math.max(15, Math.min(62, pitch)); const b = camBasis(YAW, PITCH); CAM_R = b.R; CAM_U = b.U; CAM_V = b.V; CAM_D = CAM_U.map(v => -v); }
setCam(YAW0, PITCH0);
const camDot = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const rotV = n => { const r = camDot(n,CAM_R), u = camDot(n,CAM_U), v = camDot(n,CAM_V); return [0,1,2].map(i => CAM_B0.R[i]*r + CAM_B0.U[i]*u + CAM_B0.V[i]*v); };
// the light's ground direction turns with the viewer's yaw only (shadows always fall toward the lower left of the screen)
const yawTurn = ([x,y]) => { const t = (YAW - YAW0)*Math.PI/180, c = Math.cos(t), s = Math.sin(t); return [x*c - y*s, x*s + y*c]; };
const rotXY = (x,y) => [x, y];                                                // kept for old callers
const P0 = (x,y,z) => [(x-y)*C + OX, (x+y)*S - z + OY];                       // raw iso
const P  = (x,y,z) => { const q = [x-RC[0], y-RC[1], z-RCZ];
  return [CAM_K*camDot(q,CAM_R) + (RC[0]-RC[1])*C + OX, CAM_K*camDot(q,CAM_D) + (RC[0]+RC[1])*S - RCZ + OY]; };
const Dv = (x,y,z) => [CAM_K*camDot([x,y,z],CAM_R), CAM_K*camDot([x,y,z],CAM_D)];
// distance toward the viewer: draw parts with smaller depth first
const depthOf = p => camDot(p, CAM_V);
// sort [{at:[x,y,z], svg}] back-to-front for the current camera. A part may also give box:[[x0,y0,z0],[x1,y1,z1]]:
// when two boxes are separated along x, y or z, the one on the viewer's side goes last (a centre point alone gets long
// or wrapping parts wrong: a pole beside a row of keys, a spout reaching past a cup).
const boxMid = b => [0,1,2].map(k => (b[0][k] + b[1][k]) / 2);
const sepOrder = (p, q) => { if (!p.box || !q.box) return 0;
  for (let k = 0; k < 3; k++){ if (p.box[1][k] <= q.box[0][k] + 1e-6) return CAM_V[k] >= 0 ? -1 : 1; if (q.box[1][k] <= p.box[0][k] + 1e-6) return CAM_V[k] >= 0 ? 1 : -1; }
  return 0; };
const byDepth = parts => parts.filter(Boolean).sort((p,q) => sepOrder(p,q) || (depthOf(p.at || boxMid(p.box)) - depthOf(q.at || boxMid(q.box)))).map(p => p.svg).join('');
// the half of a vertical ring that faces the viewer / is turned away, as [from, to] angles in degrees (0 = +x, 90 = +y)
const nearHalf = () => [YAW - 90, YAW + 90], farHalf = () => [YAW + 90, YAW + 270];
// an open container (cup, bin, cone, drum) between two rings: far inner wall, then its contents, then the near outer wall
const openShell = (A, B, colour, contents = '') => loft(A, B, colour, true) + contents + loft(A, B, colour);
const f  = v => v.toFixed(1);
const pd = (pts, close=true) => 'M' + pts.map(p => { const q = P(p[0],p[1],p[2]); return f(q[0])+' '+f(q[1]); }).join('L') + (close ? 'Z' : '');
const sp = pts => 'M' + pts.map(q => f(q[0])+' '+f(q[1])).join('L') + 'Z';

/* ---------- 2D shapes in a plane's (u,v) coords (v up), mapped to 3D by a plane ---------- */
const arcUV  = (cu,cv,r,a0,a1,n=7) => { const o=[]; for (let i=0;i<=n;i++){ const a=(a0+(a1-a0)*i/n)*Math.PI/180; o.push([cu+r*Math.cos(a), cv+r*Math.sin(a)]); } return o; };
const rrUV   = (u0,v0,u1,v1,r,n=7) => r <= 0 ? rectUV(u0,v0,u1,v1) : [...arcUV(u1-r,v0+r,r,-90,0,n), ...arcUV(u1-r,v1-r,r,0,90,n), ...arcUV(u0+r,v1-r,r,90,180,n), ...arcUV(u0+r,v0+r,r,180,270,n)];
const rectUV = (u0,v0,u1,v1) => [[u0,v0],[u1,v0],[u1,v1],[u0,v1]];
const ellUV  = (cu,cv,ru,rv,n=24) => Array.from({length:n}, (_,i) => { const a=i/n*2*Math.PI; return [cu+ru*Math.cos(a), cv+rv*Math.sin(a)]; });
const PX = x => ([u,v]) => [x,u,v];      // front-facing plane x = const   (u = y, v = z)
const PY = y => ([u,v]) => [u,y,v];      // side plane y = const           (u = x, v = z)
const PZ = z => ([u,v]) => [u,v,z];      // horizontal plane z = const     (u = x, v = y)
const on = (plane, uv) => uv.map(plane);

/* ---------- vectors + shading ---------- */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm=a=>{ const l=Math.hypot(...a)||1; return a.map(v=>v/l); };
const avg=ps=>ps.reduce((s,p)=>[s[0]+p[0]/ps.length,s[1]+p[1]/ps.length,s[2]+p[2]/ps.length],[0,0,0]);
const vis = n => { const r = rotV(n); return r[0]+r[1]+r[2] > 1e-6; };   // viewer looks from (+1,+1,+1) after the turn
const facing = vis;                                                       // readable alias: is this face toward the viewer?
const SHADOW_K = 0.85, AZ_MIN = 20, AZ_MAX = 160;
// cast shadows are drawn shorter than the shading light implies (0.45 × height instead of 0.85 ×): long shadows of tall
// parts on thin supports (a lamp shade, a fan head) land far from the object and read as separate blobs
const SHADOW_LEN = 0.45;
let L = [0,0,1], SH = [0,0];
function setLight(deg){ const a=deg*Math.PI/180; SH=[SHADOW_K*Math.cos(a), SHADOW_K*Math.sin(a)]; L=norm([-SH[0],-SH[1],1]); }
const LIN = norm([.6,.2,1]);                       // fixed light for interiors / small props
// Three flat tones, but blended across a narrow band at each step, so a face that turns past a threshold while the
// figure rotates fades between tones instead of snapping (at rest almost every face still sits on a pure tone).
const SOFT = .18;
const step3 = (d, hi, lo, m) => { const ss = (a, b, x) => { const k = Math.min(1, Math.max(0, (x - a)/(b - a))); return k*k*(3 - 2*k); };
  const a = ss(hi - SOFT, hi + SOFT, d), b = ss(lo - SOFT, lo + SOFT, d);
  return a >= 1 ? m.l : b <= 0 ? m.d : a > 0 ? mix(m.m, m.l, a) : b < 1 ? mix(m.d, m.m, b) : m.m; };
const tone  = (n,m) => step3(dot(rotV(n),L),   -.15, -.45, m);   // exterior, follows the sun
const toneI = (n,m) => step3(dot(rotV(n),LIN),  .6,   .05, m);   // interior / props
const mix = (a,b,t) => '#' + [1,3,5].map(i => Math.round(parseInt(a.substr(i,2),16)*(1-t) + parseInt(b.substr(i,2),16)*t).toString(16).padStart(2,'0')).join('');
const matOf = hex => ({ l:hex, m:mix(hex,'#000000',.16), d:mix(hex,'#000000',.42) });
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

/* ---------- drawing primitives (all return SVG strings) ---------- */
const ink   = (d,w=1.0) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
const fill  = (d,c,extra='') => `<path d="${d}" fill="${c}" ${extra}/>`;
const face  = (d,c) => `<path d="${d}" fill="${c}" stroke="${c}" stroke-width=".7" stroke-linejoin="round"/>`;
const shape = (pts,c,w=.9) => fill(pd(pts),c) + (w ? ink(pd(pts),w) : '');
const line  = (pts,w=.9) => ink(pd(pts,false),w);
// Loft between two rings of equal length (closed). colour(n) picks each strip's fill; flip = seen from inside.
function loft(A, B, colour, flip=false){
  const n=A.length, cen=avg(A.concat(B)); let s='';
  for (let i=0;i<n;i++){
    const a0=A[i], a1=A[(i+1)%n], b1=B[(i+1)%n], b0=B[i];
    let nr = norm(cross(sub(a1,a0), sub(b0,a0)));
    if (!isFinite(nr[0])) continue;
    if (dot(nr, sub(avg([a0,a1,b1,b0]), cen)) < 0) nr = nr.map(v=>-v);
    if (flip) nr = nr.map(v=>-v);
    if (vis(nr)) s += face(pd([a0,a1,b1,b0]), colour(nr));
  }
  return s;
}
function hull(pts){
  pts = pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]); const lo=[], up=[];
  for (const p of pts){ while(lo.length>=2 && cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  for (const p of pts.reverse()){ while(up.length>=2 && cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  lo.pop(); up.pop(); return lo.concat(up);
}
// Silhouette ink, weighted by how thick the part is on screen (like a hand inker): the w you pass is the most it gets.
// Thickness = 2 × area / perimeter of the outline (a rod's diameter, about half a box's width), as a share of the
// frame width. A long thin rod, a handle or a knob stays light (~1–1.5); a grinder, kettle or machine body gets the
// heavy ~2.4–2.8. Thin parts stay thin and parts keep air between them.
const hullInk = (pts3, w=1.4) => { const h = hull(pts3.map(p=>P(...p))); let a = 0, per = 0;
  for (let i = 0; i < h.length; i++){ const p = h[i], q = h[(i+1) % h.length]; a += p[0]*q[1] - q[0]*p[1]; per += Math.hypot(q[0]-p[0], q[1]-p[1]); }
  const thick = per ? Math.abs(a) / per / (INK_K * INK_REF_VB) : 0;
  return ink(sp(h), Math.min(w, .9 + 20*thick)); };
// Axis-aligned box: three visible faces, shaded, each outlined. shade = tone (sunlit) or toneI (interior).
function box(x0,y0,z0,x1,y1,z1,m,shade=toneI,w=.9){
  // all six faces, drawn only when they face the viewer (sides first, then top) — correct in every VIEW
  const F = [
    [[0,1,0],  [[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]]],
    [[1,0,0],  [[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]]],
    [[0,-1,0], [[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]]],
    [[-1,0,0], [[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]]],
    [[0,0,1],  [[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]]] ];
  return F.filter(([n]) => vis(n)).map(([n,q]) => shape(q, shade(n,m), w)).join('');
}
// Rounded-profile extrusion: profile (u=y, v=z) swept along x from x0 to x1. Body of most machines.
function extrude(profileUV, x0, x1, m, shade=tone){ return loft(on(PX(x0),profileUV), on(PX(x1),profileUV), n=>shade(n,m)); }
// Vertical cylinder (axis z) centred (x,y), radius r from z0 to z1, with top cap.
function cyl(x,y,z0,z1,r,m,shade=toneI,w=1.2,n=24){
  const A=on(PZ(z0),ellUV(x,y,r,r,n)), B=on(PZ(z1),ellUV(x,y,r,r,n));
  return loft(A,B,nr=>shade(nr,m)) + fill(pd(B),shade([0,0,1],m)) + hullInk([...A,...B],w) + ink(pd(B),w*.8);
}
// Cylinder lying along x (e.g. a knob or dial sticking out of a front face): centred (y,z), from x0 to x1.
function cylX(x0,x1,y,z,r,m,shade=toneI,w=1.1,n=20){
  const A=on(PX(x0),ellUV(y,z,r,r,n)), B=on(PX(x1),ellUV(y,z,r,r,n));
  // cap on whichever end faces the viewer (the +x end in VIEW 0)
  const capB = vis([1,0,0]), cap = capB ? B : A, cn = capB ? [1,0,0] : [-1,0,0];
  return loft(A,B,nr=>shade(nr,m)) + (vis(cn) ? fill(pd(cap),shade(cn,m)) : '') + hullInk([...A,...B],w) + (vis(cn) ? ink(pd(cap),w*.8) : '');
}
// Cylinder between any two 3D points a and b (a lamp arm, a rod, a pipe at an angle, a handle bar), radius r.
// The end facing the viewer gets a cap. For a tapered part (a cone, a lamp shade) pass r1 for the radius at b.
function rod(a, b, r, m, shade=toneI, w=1, r1=r, n=16){
  const d = norm(sub(b, a)), u = norm(cross(d, Math.abs(d[2]) < .9 ? [0,0,1] : [1,0,0])), v = cross(d, u);
  const ring = (p, rr) => Array.from({length:n}, (_,i) => { const t = i/n*2*Math.PI, c = Math.cos(t)*rr, s2 = Math.sin(t)*rr;
    return [p[0] + u[0]*c + v[0]*s2, p[1] + u[1]*c + v[1]*s2, p[2] + u[2]*c + v[2]*s2]; });
  const A = ring(a, r), B = ring(b, r1), capB = vis(d), cap = capB ? B : A, cn = capB ? d : d.map(x => -x);
  return loft(A, B, nr => shade(nr, m)) + (Math.max(r, r1) > 0 ? fill(pd(cap), shade(cn, m)) + ink(pd(cap), w*.8) : '') + hullInk([...A, ...B], w);
}
// Text lying flat on a front plane x = const, centred at (y,z) baseline; reads left-to-right on screen.
// text sits on a face: if its reading direction comes out mirrored (or edge-on), that face is turned away, so the text is hidden
const txM = (o, U, V) => (U[0]*V[1] - U[1]*V[0]) <= .02 * Math.hypot(...U) * Math.hypot(...V) ? `matrix(0 0 0 0 ${f(o[0])} ${f(o[1])})` : `matrix(${U[0].toFixed(4)} ${U[1].toFixed(4)} ${V[0].toFixed(4)} ${V[1].toFixed(4)} ${f(o[0])} ${f(o[1])})`;
const tx = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(0,-1,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// Text on a side plane y = const, centred at (x,z).
const txY = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(1,0,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// Cast shadow of a set of 3D points (any outline of the object), pushed along the light onto z = 0.
// the light stays put relative to the viewer, so the shadow is cast in turned coordinates
// z0: the surface it falls on (a board, a counter); clip it to that surface with clipTo(...) if it could spill off.
// clip: the 3D outline of the surface it falls on (e.g. boardTop(...)), so it can't spill over the edge.
const castShadow = (pts3, z0=0, clip=null) => { const k = SHADOW_LEN / SHADOW_K, [sx, sy] = yawTurn(SH);
  const s = fill(sp(hull(pts3.map(([x,y,z]) => P(x+(z-z0)*sx*k, y+(z-z0)*sy*k, z0)))), SHADOW);
  return clip ? clipTo(clip, s) : s; };
// A board for the object to stand on (a tray, a desk top, a counter): a rounded slab from (x0,y0) to (x1,y1), h thick.
// Draw it first; then castShadow(points, h, boardTop(x0,y0,x1,y1,h,r)) so shadows lie on it and stop at its edge.
const BOARD = { l:'#e6e1d4', m:'#cfc8b8', d:'#aaa293' }, WOOD = { l:'#d9a86c', m:'#bf8a4f', d:'#8e6236' };
const boardTop = (x0,y0,x1,y1,h=3,r=5) => on(PZ(h), rrUV(x0,y0,x1,y1,r));
function board(x0,y0,x1,y1,h=3,r=5,m=BOARD){
  const A = on(PZ(0), rrUV(x0,y0,x1,y1,r)), B = boardTop(x0,y0,x1,y1,h,r);
  return loft(A, B, n => toneI(n, m)) + fill(pd(B), m.l) + ink(pd(B), 1) + hullInk([...A, ...B], 1.8);
}
// Group helpers: clickable target, clip to an opening.
const act  = (name, inner, data='') => `<g data-act="${name}" ${data}>${inner}</g>`;
let _clipN = 0;
// Part label (for "how does it work" figures): a cream pill with a leader line to a 3D point on the part.
// dx, dy = where the pill sits, in screen units at the reference zoom (they scale with the figure like stroke widths).
// on = that part is working right now (the pill turns the accent colour). Labels can be hidden with the Labels switch.
function tag(p3, dx, dy, text, on=false){
  // on a phone (LBL_U = drawing units per screen px) the pill is a numbered badge and the names go in a legend under the figure
  const u = window.LBL_U ? LBL_U() : 0, n = ((window.__ln || (window.__ln = {}))[text] || (__ln[text] = Object.keys(__ln).length + 1));

      for (const c of b.choices(st)){ const ch = document.createElement('button'); ch.className = 'chip' + (c.current ? ' current' : c.disabled ? ' off' : ''); ch.textContent = c.label;

  if (q.has('press')) q.get('press').split(',').forEach(item => { const [what, ms] = item.split('@'), [label, choice] = what.split('>');

}

/* ---------- see-through + labels kit (shared; the figure supplies its own working parts) ----------

   xrGhost(body, mech, k, OUTp, x0, x1, m): far walls faintly, the working parts, then the case as a ghost over them.
   xrMount(getUI, caption): the See-through / Labels switches (top right), the caption under the figure, label hiding. */
function xrCallouts(items, B){
  const pts = []; for (const x of [B[0], B[1]]) for (const y of [B[2], B[3]]) for (const z of [B[4], B[5]]) pts.push(P(x, y, z));
  const xmin = Math.min(...pts.map(p => p[0])), xmax = Math.max(...pts.map(p => p[0])), cx = (xmin + xmax)/2;

  const L = [], R = [];

  const wMax = u ? hgt*1.3 + 12*k : Math.max(...items.map(it => it.text.length))*fs*.62 + fs*1.5 + 12*k;
  const roomL = xmin - vb.x >= wMax, roomR = vb.x + vb.width - xmax >= wMax;
  for (const it of items){ const [X, Y] = P(...it.at); ((X < cx && roomL) || !roomR ? L : R).push({ ...it, X, Y }); }

    if (q.y > 0) top[-1] = q.y + hgt; }

    const room = col.length ? col[0].py - top[side] : 0; for (const c of col) c.py -= Math.min(shift, room);

        + `<circle cx="${f(c.X)}" cy="${f(c.Y)}" r="${f(1.4*k)}" fill="${INK}"/>`
        + `<rect x="${f(px - w/2)}" y="${f(c.py - hgt/2)}" width="${f(w)}" height="${f(hgt)}" rx="${f(hgt/2)}" fill="${c.on ? 'var(--accent,#f4b829)' : '#fff4d6'}" stroke="${INK}" stroke-width="1.2"/>`
        + `<text x="${f(px)}" y="${f(c.py + fs*.36)}" font-size="${f(fs)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".04em" fill="${INK}">${u ? c.n : c.text}</text></g>`;

}
function xrGhost(body, mech, k, OUTp, x0, x1, m){

    + (fF ? fill(pd(on(PX(x0), OUTp)), mix(m.d, '#f2efe7', .5)) : '') + (fB ? fill(pd(on(PX(x1), OUTp)), mix(m.d, '#f2efe7', .5)) : '') + `</g>`;

// same, for a body lofted between two horizontal rings A (bottom) and B (top)
function xrGhostRings(body, mech, k, A, B, m){

// generic see-through for any figure: the whole drawing fades back and the inside parts show over it.
//   opts: { mech(st, k) -> svg, inside(st) -> label items, surface(st) -> label items (optional), B: bounds, getSt() }
// washer-style ghost for an object without a single box case: its inside parts first, then the object pale over them
const xrUnder = (svg, mech, k) => `<g opacity="${f(k)}">${mech}</g><g opacity="${f(1 - .62*k)}">${svg}</g>`;
function xrWrap(sceneFn, opts){
  return function(){

    const items = k > .6 ? opts.inside(st) : opts.surface ? opts.surface(st) : [];

}

<script>
/* Phone touchscreen: how a tap on the keyboard becomes a letter.
   How it really works (mutual-capacitance touch, as in today's phones):
   1. Under the cover glass, right on top of the OLED screen, sits a grid of fine metal lines a few mm apart:
      drive lines (rows, across the phone) and sense lines (columns, along it). Each crossing is a tiny capacitor.
   2. The touch chip on the display's flex cable pulses one drive line at a time and measures how much of that pulse
      reaches every sense line, crossing by crossing. It scans the whole grid many times a second.
   3. A finger conducts and is grounded through the body. Near a crossing it pulls away part of the electric field
      between the two lines, so a little less signal arrives there. A glove does not conduct: nothing changes.
   4. A few crossings under the fingertip read weaker. The chip takes the middle of that dip (a weighted average),
      which is finer than the grid itself, and sends the point to the main processor on the logic board.
   5. The keyboard software checks which key's touch area holds that point. Its hidden touch areas grow for the
      letters you are likely to type next (after "h": vowels). The key pops up while you touch it; the letter goes in
      when you lift; the Taptic Engine can tap back.
   Parts (each held by another):
   CASE      aluminium frame band . back glass (wireless charging coil and magnet ring stuck inside it) . cover glass
             with its black border . volume buttons and action button (left) . side button (right) . USB-C port .
             speaker holes
   SCREEN    OLED panel (pixels under a sealing film) . touch grid on that film: drive lines, sense lines . the flex
             cable folded under the bottom edge, carrying the touch chip
   INSIDE    midplate in the frame . logic board (processor, memory, storage, modem) beside the camera block . three
             rear cameras . battery . Taptic Engine . speaker . USB-C port . display connector on the board
   Coordinates: x = along the phone (0 = top, 147 = bottom, toward the viewer at the default view), y = across
   (72 = the screen's left edge), z = up (screen at the top, 7.8). Screen coords (u right, v down) are mapped by S2W. */

  `<text transform="${txM(P(...S2W(u, v, z)), Dv(0,-1,0), Dv(1,0,0))}" font-size="${size}" fill="${col}" text-anchor="${anchor}" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-weight="${weight}">${str}</text>`;

/* ---------- the keyboard layout (screen coords) ---------- */
const KEYS = (() => {
  const k = [], row = (s, u0, v0) => [...s].forEach((ch, i) => k.push({ ch, u0: u0 + 6.6*i, v0, u1: u0 + 6.6*i + 5.8, v1: v0 + 8.6 }));

/* ---------- the touch grid ---------- */
const ROWS = Array.from({length:23}, (_, i) => 3.2 + 6*i);          // drive lines (constant v)
const COLS = Array.from({length:11}, (_, j) => 3.4 + 6*j);          // sense lines (constant u)
const SIG = 3.2;                                                    // how far a fingertip's pull reaches (mm)
const dipAt = (st, u, v) => st.glove || !(st.fz > .97) ? 0 : Math.exp(-((u - st.cu)**2 + (v - st.cv)**2)/(2*SIG*SIG));

/* ---------- screen picture (drawn on the OLED's top) ---------- */
function screenUI(st, z){
  let s = shape(rrS(0, 0, SW, SLN, 8.4, z, 5), '#fbfbfd', 0);
  s += tS(9.5, 4.9, '9:41', 2.7, '#111', z, 700) + shape(rrS(24.2, 1.3, 42.6, 5.6, 2.2, z), '#0b0b0d', 0);
  s += shape(rrS(54.6, 2.5, 60.4, 4.7, .7, z), '#111', 0) + shape(rrS(60.7, 3.1, 61.3, 4.1, .2, z), '#111', 0);
  for (let i = 0; i < 4; i++) s += shape(rrS(45.6 + 1.5*i, 4.7 - .55*(i+1), 46.6 + 1.5*i, 4.7, .2, z), '#111', 0);
  s += shape(ellS(33.4, 11.2, 3.7, z, 18), '#a9afba', 0) + tS(33.4, 12.3, 'S', 3, '#fff', z, 700) + tS(33.4, 18.1, 'Sam', 2.1, '#6b6b70', z, 500);
  s += `<path d="${pd([S2W(0, 20, z), S2W(SW, 20, z)], false)}" stroke="#d8d8dc" stroke-width=".3"/>`;
  const bub = (u0, v0, txt, out) => { const w = txt.length*1.42 + 5.4, a = out ? SW - 3 - w : 3;
    return shape(rrS(a, v0, a + w, v0 + 7, 3.4, z), out ? '#0a84ff' : '#e9e9eb', 0) + tS(a + 2.7, v0 + 4.6, txt, 2.5, out ? '#fff' : '#111', z, 500, 'start'); };
  const msgs = [['On your way?', 0], ['Leaving now', 1], ['Grab milk?', 0], ...st.sent.map(t => [t, 1])].slice(-5);
  msgs.forEach(([t, o], i) => { s += bub(0, 78 - 9*(msgs.length - i) + 1, t, o); });
  if (st.sent.length) s += tS(SW - 4, 79.6, 'Delivered', 1.6, '#8e8e93', z, 500, 'end');
  // the text field, its caret and the send arrow
  s += shape(rrS(6, 82.4, 58.4, 89.6, 3.6, z), '#ffffff', 0) + `<path d="${pd(rrS(6, 82.4, 58.4, 89.6, 3.6, z))}" fill="none" stroke="#c7c7cc" stroke-width=".35"/>`;
  s += shape(ellS(2.9, 86, 2.4, z, 14), '#d1d1d6', 0);
  s += st.typed ? tS(8.6, 87.1, st.typed, 2.6, '#111', z, 500, 'start') : tS(8.6, 87.1, 'Text Message', 2.4, '#a0a0a6', z, 500, 'start');
  const cu = 8.8 + st.typed.length*1.5;
  s += `<path d="${pd([S2W(cu, 83.8, z), S2W(cu, 88.2, z)], false)}" stroke="#0a84ff" stroke-width=".45"/>`;
  s += shape(ellS(61.8, 86, 2.9, z, 16), st.typed ? '#0a84ff' : '#c7c7cc', 0)
    + `<path d="${pd([S2W(61.8, 87.6, z), S2W(61.8, 84.4, z)], false)}${pd([S2W(60.6, 85.6, z), S2W(61.8, 84.4, z), S2W(63, 85.6, z)], false)}" fill="none" stroke="#fff" stroke-width=".5" stroke-linecap="round"/>`;
  // keyboard
  s += shape(rrS(0, 91.2, SW, 128, 0, z), '#d1d4da', 0) + shape(rrS(0, 118, SW, SLN, 8.4, z, 5), '#d1d4da', 0);
  for (const k of KEYS){
    const lit = st.popKey === k.ch && st.pop > .02;
    s += shape(rrS(k.u0, k.v0 + .25, k.u1, k.v1 + .25, 1.1, z), '#8d929b', 0) + shape(rrS(k.u0, k.v0, k.u1, k.v1, 1.1, z), k.sp ? '#adb3bd' : lit ? '#e4e6ea' : '#ffffff', 0);
    const lab = k.ch === 'shift' ? '&#8679;' : k.ch === 'del' ? '&#9003;' : k.ch === 'space' ? 'space' : k.ch === 'return' ? 'return' : k.ch === '123' ? '123' : k.ch.toUpperCase();
    s += tS((k.u0 + k.u1)/2, (k.v0 + k.v1)/2 + (k.ch.length > 1 ? .8 : 1.2), lab, k.ch.length > 1 ? 2.1 : 3.4, '#111', z, k.ch.length > 1 ? 500 : 400);
  }
  s += shape(rrS(22, 137.6, 44.8, 139, .7, z), '#111', 0);
  // the key pops up above the finger while it is touched (iOS shows it on touch, types it on lift)
  if (st.pop > .02 && st.popKey){ const k = keyOf(st.popKey), a = st.pop;
    const pu0 = k.u0 - 1.4, pu1 = k.u1 + 1.4, top = k.v0 - 14*a;
    s += `<g opacity="${f(Math.min(1, a*1.5))}">` + shape(rrS(pu0 - .3, top + .6, pu1 + .3, k.v1 + .7, 1.8, z), 'rgba(40,50,70,.22)', 0) + shape(rrS(pu0, top, pu1, k.v1, 1.6, z), '#ffffff', 1.1)
      + tS((k.u0 + k.u1)/2, top + 7, k.ch.toUpperCase(), 6.4, '#111', z, 400) + `</g>`;
  }
  return s;
}

/* ---------- the grid, its scan, the dip and the touch point (drawn on the sensor film) ---------- */
function gridSVG(st, z, frozenGlow){
  let rows = '', cols = '';
  for (const v of ROWS) rows += pd([S2W(.4, v, z), S2W(SW - .4, v, z)], false);
  for (const u of COLS) cols += pd([S2W(u, .6, z), S2W(u, SLN - .6, z)], false);
  let s = `<path d="${rows}" fill="none" stroke="#5b8fd6" stroke-width=".32" opacity=".55"/><path d="${cols}" fill="none" stroke="#3fae78" stroke-width=".32" opacity=".55"/>`;
  if (st.row >= 0){ const v = ROWS[st.row], d = pd([S2W(.4, v, z), S2W(SW - .4, v, z)], false);
    s += `<path d="${d}" fill="none" stroke="${amb}" stroke-width="2.2" opacity=".45" filter="url(#tcSoft)"/><path d="${d}" fill="none" stroke="#ffd36a" stroke-width=".8"/>`; }
  // hidden touch areas: the keyboard's own guesses, invisible on a real phone
  for (const k of KEYS){ const g = grow(k, st); if (!g) continue;
    s += `<path d="${pd(rrS(k.u0 - g, k.v0 - g, k.u1 + g, k.v1 + g, 1.6, z + .02))}" fill="none" stroke="#ff8a1f" stroke-width=".45" stroke-dasharray="1.1 .8"/>`; }
  for (const key in st.dots){ const [i, j] = key.split(',').map(Number), a = st.dots[key], p = ellS(COLS[j], ROWS[i], .5 + 1.5*a, z + .02, 12);
    s += fill(pd(p), amb, `opacity="${f(.45 + .55*a)}"`) + ink(pd(p), .3); }
  if (st.cent && st.centA > .01){ const { u, v } = st.cent, o = st.centA;
    s += `<g opacity="${f(o)}">` + `<path d="${pd(ellS(u, v, 2.6, z + .04, 18))}" fill="none" stroke="#ff6a1a" stroke-width=".7"/>`
      + `<path d="${pd([S2W(u - 3.8, v, z + .04), S2W(u + 3.8, v, z + .04)], false)}${pd([S2W(u, v - 3.8, z + .04), S2W(u, v + 3.8, z + .04)], false)}" stroke="#ff6a1a" stroke-width=".45"/>`
      + fill(pd(ellS(u, v, .6, z + .05, 10)), '#ff6a1a') + `</g>`; }
  // the electric field between drive and sense lines at the crossings near the fingertip; under it, pulled into the finger
  if (st.fz > .97){ let pull = '', loop = '';
    const reach = frozenGlow ? 13 : 9, top = z + 3.4;
    for (const [i, v] of ROWS.entries()) for (const [j, u] of COLS.entries()){
      const d = Math.hypot(u - st.cu, v - st.cv); if (d > reach) continue;
      const p0 = S2W(u, v, z);
      if (!st.glove && d < 5.2){ const tip = S2W(st.cu + (u - st.cu)*.35, st.cv + (v - st.cv)*.35, top);
        pull += pd([p0, [p0[0]*.6 + tip[0]*.4, p0[1]*.6 + tip[1]*.4, z + 1.8], tip], false); }
      else for (const s2 of [-1, 1]){ const pts = []; for (let t = 0; t <= 6; t++){ const a = t/6, w = Math.sin(a*Math.PI);
          pts.push(S2W(u + s2*(1 - Math.cos(a*Math.PI))*1.3, v + s2*(1 - Math.cos(a*Math.PI))*1.3, z + 2*w)); }
        loop += pd(pts, false); }
    }
    const w = frozenGlow ? .7 : .45;
    s += `<path d="${loop}" fill="none" stroke="#ffc54d" stroke-width="${w}" opacity=".8"/>`
      + `<path d="${pull}" fill="none" stroke="#ff8a1f" stroke-width="${w*1.25}" opacity=".95" stroke-dasharray="${frozenGlow ? '1.2 .7' : 'none'}"/>`;
  }
  return s;
}

/* ---------- inside the frame ---------- */
const PCB = { l:'#3f6a55', m:'#2f5242', d:'#1d362b' }, BATT = { l:'#55585e', m:'#3e4146', d:'#2a2c30' }, FLEX = { l:'#d2a874', m:'#b78a55', d:'#7e5c35' };
const LENS = { l:'#2c3036', m:'#1f2226', d:'#131518' };
let NB = {};
function insideParts(st){
  const parts = [], bx = (x0, y0, z0, x1, y1, z1, m, w = .7, name, extra = '') => { const b = [[x0, y0, z0], [x1, y1, z1]]; if (name) NB[name] = b;
    parts.push({ box: b, svg: box(x0, y0, z0, x1, y1, z1, m, toneI, w) + extra }); };
  bx(6, 36, 1.2, 62, 67, 2.2, PCB, .7, 'board'); bx(36, 4, 1.2, 62, 36, 2.2, PCB, .7, 'board2');
  bx(40, 42, 2.2, 52, 54, 3.1, METAL, .6, 'soc'); bx(16, 46, 2.2, 28, 58, 2.9, DARK, .5); bx(45, 10, 2.2, 55, 20, 2.8, DARK, .5); bx(54, 56, 2.2, 60, 62, 2.6, DARK, .4);
  bx(56, 28, 2.2, 62, 38, 3, DARK, .4, 'conn');
  for (const [cx, cy] of [[13, 12], [13, 26], [25, 19]]){ const b = [[cx - 5.6, cy - 5.6, 1.2], [cx + 5.6, cy + 5.6, 5.6]];
    parts.push({ box: b, svg: cyl(cx, cy, 1.2, 5.6, 5.4, LENS, toneI, .7, 20) + fill(pd(on(PZ(5.62), ellUV(cx, cy, 3, 3, 16))), '#3c5a78') + fill(pd(on(PZ(5.64), ellUV(cx - 1, cy + 1, 1, 1, 8))), '#ffffff', 'opacity=".5"') }); }
  bx(66, 6, 1.2, 136, 48, 5.2, BATT, .8, 'battery');
  bx(120, 52, 1.2, 141, 67, 4.8, METAL, .7, 'taptic', st.tap > .02 ? fill(pd(on(PZ(4.82), rectUV(121, 53, 140, 66))), amb, `opacity="${f(.85*st.tap)}"`) : '');
  bx(128, 6, 1.2, 142, 20, 4, DARK, .6); bx(139, 30, 2, 147, 42, 5.6, METAL, .6, 'port');
  bx(62, 28, 5.3, 128, 36, 5.6, FLEX, .5);                                          // display flex over the battery to its connector
  return byDepth(parts);
}
function touchFlex(st){                                                             // folded under the bottom edge, with the touch chip
  const on_ = st.fz > .97 || st.row >= 0;
  return box(136, 28, 5.7, PL - 2.2, 36, 5.95, FLEX, toneI, .5) + box(PL - 3, 28, 5.95, PL - 2.2, 36, Z_GRID, FLEX, toneI, .4)
    + box(137.5, 29, 5.95, 143.5, 35, 6.4, DARK, toneI, .6) + (on_ ? fill(pd(on(PZ(6.42), rectUV(138, 29.5, 143, 34.5))), amb, `opacity="${f(.25 + .35*(st.fz > .97 ? 1 : .4))}"`) : '');
}

/* ---------- the hand (drawn flat, hand-inked, in the picture's own plane): it slides in from off the picture ---------- */
const SKIN = { l:'#f3c9a8', m:'#e2a886', d:'#c4876a', nail:'#f8e0d2' }, GLOVE = { l:'#d0605a', m:'#b2463f', d:'#86302b' };
const SLEEVE = { l:'#6d7d9c', m:'#56658a', d:'#3e4b6b' };
const FDIR = norm([16, -38, 33]);
const HAND_TRAVEL = 170;
// local frame: X along the arm away from the fingertip, Y across it (+Y = the lower side on screen)
const HB = { // shapes, smoothed closed outlines
  sleeve: [[112,-24],[400,-30],[400,52],[112,44]],
  cuff:   [[106,-21],[124,-23],[124,42],[106,38]],
  curl1:  [[50,8],[62,7],[64,16],[60,24],[52,24],[48,16]],
  curl2:  [[63,11],[76,10],[78,20],[74,28],[66,28],[62,19]],
  curl3:  [[77,14],[90,13],[92,23],[88,30],[80,30],[76,22]],
  back:   [[-2.6,0],[-.6,-5.2],[4,-7.5],[18,-7.9],[32,-8.5],[44,-9.9],[55,-12.4],[72,-15],[92,-17],[116,-18.5],[116,36],[100,32],[86,24],[72,17],[57,12.5],[44,9.6],[32,8.6],[18,8],[4,7.4],[-.6,5.2]],
  under:  [[2,4.6],[18,5.4],[32,6],[44,7.2],[44,9.6],[32,8.6],[18,8],[4,7.4]],
  thumb:  [[76,3],[60,4.4],[46,7.4],[39,11],[42,15.4],[56,15.6],[72,14.2],[82,9.6]],
  nail:   [[2.6,-3.8],[11,-4.3],[12.2,-1.2],[11,1.8],[2.8,1.6],[1.2,-1.1]],
};
function smoothD(pts){                                            // closed Catmull-Rom through screen points
  const n = pts.length; let d = `M${f(pts[0][0])} ${f(pts[0][1])}`;
  for (let i = 0; i < n; i++){ const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    d += `C${f(p1[0] + (p2[0] - p0[0])/6)} ${f(p1[1] + (p2[1] - p0[1])/6)} ${f(p2[0] - (p3[0] - p1[0])/6)} ${f(p2[1] - (p3[1] - p1[1])/6)} ${f(p2[0])} ${f(p2[1])}`; }
  return d + 'Z';
}
function handFrame(st){
  const sc = Math.hypot(...Dv(...CAM_R)), d = Dv(...FDIR), dl = Math.hypot(...d) || 1, u = [d[0]/dl, d[1]/dl], v = [-u[1], u[0]];
  const out = (1 - st.fz)*HAND_TRAVEL, [ox, oy] = P(...S2W(st.cu, st.cv, PH));
  const O = [ox + u[0]*out*sc, oy + u[1]*out*sc];
  return { T: ([X, Y]) => [O[0] + (u[0]*X + v[0]*Y)*sc, O[1] + (u[1]*X + v[1]*Y)*sc], sc, h: 9 + (1 - st.fz)*40 };
}
function handSVG(st){
  const { T, sc } = handFrame(st), g = st.glove, m = g ? GLOVE : SKIN, w = 2.2, D = k => smoothD(HB[k].map(T));
  const sh = (k, col, lw = w) => `<path d="${D(k)}" fill="${col}" stroke="${INK}" stroke-width="${f(lw)}" stroke-linejoin="round"/>`;
  const line = (pts, lw = 1.1) => `<path d="M${pts.map(T).map(q => f(q[0]) + ' ' + f(q[1])).join('Q')}" fill="none" stroke="${INK}" stroke-width="${f(lw)}" stroke-linecap="round"/>`;
  let s = sh('sleeve', SLEEVE.m) + `<path d="M${[[130,-26],[400,-31]].map(T).map(q => f(q[0]) + ' ' + f(q[1])).join('L')}" stroke="${SLEEVE.l}" stroke-width="${f(5*sc)}" fill="none"/>`;
  s += sh('cuff', g ? m.d : SLEEVE.d);
  if (g) for (let x = 109; x < 124; x += 3) s += line([[x, -20], [x + .4, 10], [x, 38]], .8);
  s += sh('curl3', m.d) + sh('curl2', m.d) + sh('curl1', m.m);
  s += sh('back', m.l, 2.6) + `<path d="${D('under')}" fill="${m.m}"/>`;
  s += sh('thumb', m.m);
  if (!g) s += sh('nail', m.nail, 1);
  else s += line([[2, -6], [3, 0], [2, 6]], .8) + line([[8, -7], [9, 0], [8, 7]], .8);   // knit seams at the tip
  s += line([[17, -6.6], [16, 0], [17, 6.6]]) + line([[31, -7.3], [30, 0], [31, 7.3]]);              // finger creases
  s += line([[56, -9.5], [61, -10.2], [66, -10.6]], .9) + line([[60, -4], [66, -5.4], [74, -6.4]], .9);
  return s;
}
function handShadow(st){
  const { T, h } = handFrame(st), k = SHADOW_LEN / SHADOW_K, [sx, sy] = yawTurn(SH);
  const dd = Dv(h*sx*k, h*sy*k, -h*.35);
  const S = q => { const p = T(q); return [p[0] + dd[0], p[1] + dd[1]]; };
  const sh = `<path d="${smoothD(HB.back.map(S))}${smoothD(HB.sleeve.map(S))}${smoothD(HB.curl2.map(S))}" fill="#3a4a80"/>`;
  return `<g opacity="${f(.2 - .1*(1 - st.fz))}">${clipTo(on(PZ(PH + .05), OUTL), sh)}</g>`;
}

/* ---------- take apart: each layer lifts on its own, fanning toward the top of the phone ---------- */
const apE = st => st.xr > 0 ? ease(Math.min(1, st.ap || 0)) : 0;
const LAYER_DZ = { back:-16, frame:0, oled:20, grid:36, glass:52 };
const lOff = (st, name) => { const e = apE(st), dz = LAYER_DZ[name]*e; return [-.3*dz, 0, dz]; };
const lG = (st, name, svg) => { const v = lOff(st, name); if (!v[2]) return svg; const d = Dv(...v); return `<g transform="translate(${f(d[0])} ${f(d[1])})">${svg}</g>`; };
const lAt = (st, name, p) => { const v = lOff(st, name); return p.map((c, i) => c + v[i]); };

/* ---------- scene ---------- */
function scene(st, m){
  NB = {};
  const k = ease(st.xr || 0), e = apE(st);
  let s = `<defs><filter id="tcSoft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="${(1.2*INK_K).toFixed(2)}"/></filter></defs>`;
  const A = on(PZ(0), OUTL), B = on(PZ(PH), OUTL), disp = rrS(0, 0, SW, SLN, 8.4, PH);
  s += castShadow([...A, ...B]);
  // back glass (only seen once the phone is in pieces): charging coil and magnet ring stuck inside it
  if (e > .01){ const A0 = on(PZ(0), OUTL), B0 = on(PZ(.8), OUTL); let bg = loft(A0, B0, n => tone(n, m)) + fill(pd(B0), mix(m.l, '#ffffff', .15)) + hullInk([...A0, ...B0], 1.6);
    let coil = ''; for (let r = 7; r <= 19; r += 2.4) coil += pd(on(PZ(.84), ellUV(80, 36, r, r, 26)));
    bg += `<path d="${coil}" fill="none" stroke="#c98a3d" stroke-width="1"/>` + `<path d="${pd(on(PZ(.86), ellUV(80, 36, 23, 23, 30)))}" fill="none" stroke="#8f989b" stroke-width="1.6"/>`;
    NB.coil = [[57, 13, 0], [103, 59, .9]];
    s += lG(st, 'back', `<g opacity="${f(Math.min(1, e*2))}">${bg}</g>`); }
  // side buttons: drawn after the frame when their side faces us, before it (hidden) when not
  const btnL = box(20, PW, 3, 27, PW + .7, 5.4, m, tone, .6) + box(33, PW, 3, 43, PW + .7, 5.4, m, tone, .6) + box(47, PW, 3, 57, PW + .7, 5.4, m, tone, .6);
  const btnR = box(38, -.7, 3, 56, 0, 5.4, m, tone, .6);
  const fL = facing([0,1,0]), fR = facing([0,-1,0]), fB = facing([1,0,0]);
  let frame = '';
  const z0 = e > .01 ? .8 : 0, Af = on(PZ(z0), OUTL);
  if (e > .01) frame += `<g opacity="${f(.55*e)}">` + loft(Af, B, n => mix(toneI(n.map(v => -v), m), '#f2efe7', .35), true) + fill(pd(Af), mix(m.d, '#f2efe7', .45)) + `</g>`;
  if (e > .01) frame += `<g opacity="${f(e)}">` + fill(pd(on(PZ(1.15), rrUV(1.2, 1.2, PL - 1.2, PW - 1.2, PRAD - 1, 5))), '#c9ccd0') + insideParts(st) + `</g>`;
  let band = loft(Af, B, n => tone(n, m));
  if (fB){ band += shape([[PL + .05, 33, 3], [PL + .05, 39, 3], [PL + .05, 39, 4.8], [PL + .05, 33, 4.8]], '#1a1b1e', .4);
    for (const y of [10, 12.5, 15, 17.5, 20, 52, 54.5, 57, 59.5, 62]) band += fill(pd(on(PX(PL + .05), ellUV(y, 3.9, .6, .6, 8))), '#1a1b1e'); }
  frame += `<g opacity="${f(1 - .75*e)}">${band}</g>`;
  s += (fL ? '' : btnL) + (fR ? '' : btnR) + lG(st, 'frame', frame);
  // the OLED panel with the picture; in see-through it turns half see-through so the parts under it show
  const oA = rrS(0, 0, SW, SLN, 8.4, 6.4, 5), oB = rrS(0, 0, SW, SLN, 8.4, Z_OLED, 5);
  let oled = (e > .01 ? loft(oA, oB, n => toneI(n, DARK)) : '') + screenUI(st, Z_OLED) + (e > .01 ? ink(pd(oB), .8) : '');
  s += lG(st, 'oled', oled);
  // the touch film: its folded flex with the chip, then the grid
  if (k > 0) s += lG(st, 'grid', `<g opacity="${f(k)}">` + touchFlex(st) + (e > .01 ? ink(pd(rrS(0, 0, SW, SLN, 8.4, Z_GRID, 5)), .6) : '') + gridSVG(st, Z_GRID, st.frozen) + `</g>`);
  // cover glass: the black border and a sheen; in pieces, a pale slab of glass
  const rim = `<path d="${pd(B)}${pd(disp)}" fill="#141518" fill-rule="evenodd"/>`;
  let glass = '';

<script>(() => { const fig = document.getElementById("fig"); if (!fig) return;
  const lg = document.createElement("div"); lg.className = "lgd"; const at = document.querySelector(".zwrap") || fig; at.parentNode.insertBefore(lg, at.nextSibling);
  const hs = document.createElement("style"); document.head.appendChild(hs);
  let sig = "", sel = 0, q = 0, names = "", num = new Map();
  // the figure's own numbers count every label it has ever drawn; here they are reset to 1, 2, 3... down the left
  // column then the right, each time the set of labels changes (so they hold still while the figure turns)
  const renum = () => { if (innerWidth > 560) return; const gs = [...fig.querySelectorAll(".tag[data-t]")];
    const key = gs.map(g => g.dataset.t).sort().join("|");
    if (key !== names){ names = key; num = new Map(); const vb = fig.viewBox.baseVal, cx = vb.x + vb.width/2;
      const at = g => { const r = g.querySelector("rect"); return r ? [+r.getAttribute("x") + r.getAttribute("width")/2, +r.getAttribute("y")] : [0, 0]; };
      gs.map(g => [g.dataset.t, ...at(g)]).sort((a, b) => ((a[1] > cx) - (b[1] > cx)) || a[2] - b[2]).forEach(([t]) => { if (!num.has(t)) num.set(t, num.size + 1); }); }
    for (const g of gs){ const n = String(num.get(g.dataset.t)); if (g.dataset.n !== n){ g.dataset.n = n; const t = g.querySelector("text"); if (t) t.textContent = n; } } };
  const mark = () => { hs.textContent = sel ? `#fig .tag[data-n="${sel}"] rect{fill:#231e16!important}#fig .tag[data-n="${sel}"] text{fill:#fff4d6}#fig .tag[data-n="${sel}"] path{stroke-width:2.4}` : "";
    for (const x of lg.children) x.classList.toggle("sel", +x.dataset.n === sel); };
  const upd = () => { q = 0; const m = new Map();
    if (innerWidth <= 560) for (const g of fig.querySelectorAll(".tag[data-n]")){ const n = +g.dataset.n; if (!m.has(n)) m.set(n, [g.dataset.t, g.classList.contains("on")]); }
    const a = [...m].sort((x, y) => x[0] - y[0]), s = JSON.stringify(a); if (s === sig) return; sig = s;
    lg.classList.toggle("has", a.length > 0);
    lg.innerHTML = a.map(([n, [t, on]]) => `<button data-n="${n}" class="${on ? "on" : ""}"><b>${n}</b><span>${t}</span></button>`).join(""); mark(); };
  lg.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; sel = sel === +b.dataset.n ? 0 : +b.dataset.n; mark(); });
  new MutationObserver(() => { renum(); if (!q) q = requestAnimationFrame(upd); }).observe(fig, { childList: true, subtree: true }); renum();
  addEventListener("resize", () => { if (!q) q = requestAnimationFrame(upd); }); upd(); })();</script><style id="inkside-bar-css">
#inkside-bar{position:fixed;top:0;left:0;right:0;z-index:1000;height:44px;display:flex;align-items:center;gap:12px;
  padding:0 14px;padding-top:env(safe-area-inset-top);box-sizing:content-box;background:#f2efe7;border-bottom:1.5px solid #231e16;
  font:13px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#231e16}
#inkside-bar a{flex:none;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:1.5px solid #231e16;border-radius:999px;
  background:#f4b829;color:#231e16;text-decoration:none;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11.5px;box-shadow:0 2px 0 #231e16}
#inkside-bar a:active{transform:translateY(2px);box-shadow:none}
#inkside-bar .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:16px}
#inkside-bar .n{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:11px;letter-spacing:.12em;margin-right:8px;color:#857d6e}

@media (min-width:561px){body{padding-top:calc(68px + env(safe-area-inset-top))!important}}
body > header{display:none!important}
</style>
<script>(() => { const b = document.createElement("nav"); b.id = "inkside-bar"; b.setAttribute("aria-label", "Inkside");
  b.innerHTML = '<a href="../index.html">&larr; Inkside</a><span class="t"><span class="n">FIG. 11</span>The touchscreen</span>';
  document.body.prepend(b); document.title = "Fig. 11 \u00b7 The touchscreen \u00b7 Inkside";
